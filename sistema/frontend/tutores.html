<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutores - Clínica Vet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-pagina="tutores">
  <div class="app">
    <aside class="menu">
      <div class="marca">Clínica Vet<small>Sistema de gestão</small></div>
      <nav>
        <a href="dashboard.html">Início</a>
        <a href="tutores.html">Tutores</a>
        <a href="pets.html">Pets</a>
        <a href="agendamentos.html">Agendamentos</a>
      </nav>
    </aside>

    <div>
      <div class="topo">
        <h1>Tutores</h1>
        <div class="usuario">
          <span id="nomeUsuario"></span>
          <button id="btnSair" class="btn-sair">Sair</button>
        </div>
      </div>

      <main>
        <p id="msgTutor" class="aviso" hidden></p>

        <div class="painel">
          <section class="card">
            <div class="card-topo">
              <h2>Tutores cadastrados</h2>
            </div>
            <div class="card-corpo">
              <form id="formBusca" class="acoes">
                <input type="text" id="busca" placeholder="Buscar por nome, e-mail ou telefone...">
                <button type="submit">Buscar</button>
                <button type="button" id="btnLimparBusca" class="secundario">Limpar</button>
              </form>
            </div>
            <div class="tabela-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="tabelaTutores"></tbody>
              </table>
            </div>
          </section>

          <section class="card">
            <div class="card-topo">
              <h3 id="tituloFormTutor">Novo tutor</h3>
            </div>
            <div class="card-corpo">
              <form id="formTutor">
                <input type="hidden" id="tutorId">

                <div class="campo">
                  <label for="tutorNome">Nome</label>
                  <input type="text" id="tutorNome" required>
                </div>

                <div class="campo">
                  <label for="tutorCpf">CPF</label>
                  <input type="text" id="tutorCpf" maxlength="14" placeholder="000.000.000-00">
                  <p class="dica" id="dicaCpf">O CPF é gravado criptografado no banco.</p>
                </div>

                <div class="campo">
                  <label for="tutorTelefone">Telefone</label>
                  <input type="text" id="tutorTelefone">
                </div>

                <div class="campo">
                  <label for="tutorEmail">E-mail</label>
                  <input type="email" id="tutorEmail">
                </div>

                <div class="acoes">
                  <button type="submit">Salvar</button>
                  <button type="button" id="btnCancelarTutor" class="secundario">Cancelar</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
